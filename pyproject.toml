[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-runtime"
version = "2.2.0"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "tensorflow>=2.15.0",
    "Unidecode>=1.4.0",
    "spacy>=3.8.0",
    "huggingface_hub>=0.20.0",
    "websockets>=15.0.1"
]
