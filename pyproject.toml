[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-runtime"
version = "2.2.2"
description = "API that analyzes news content and verifies its veracity using AI."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

authors = [
    { name = "Eric Santos", email = "ericshantos13@gmail.com" }
]

dependencies = [
    "tensorflow>=2.15.0",
    "Unidecode>=1.4.0",
    "spacy>=3.8.0",
    "huggingface_hub>=0.20.0",
    "websockets>=15.0.1",
    "python-dotenv"
]
